name: Verify Archive Integrity

# 자체 cron 을 두지 않는다. report.yml 과 같은 이유다 - 검사 대상이 그날
# 스캔이 방금 커밋한 history/*.csv 라, 시각으로 맞춰 두면 스캔이 밀렸을 때
# (Actions 스케줄은 5~30분 밀린다) 어제 데이터를 다시 검사한다.
#
# report 와 나란히 돈다. 순서를 두지 않는 것은 의도다 - 아카이브가 갈렸어도
# 리포트는 나가야 한다. 리포트를 막으면 "데이터가 조금 이상하다" 때문에
# 그날 성과 스냅샷이 통째로 비고, 사람이 볼 것이 하나도 남지 않는다.
# 여기서 잡는 것은 "리포트를 믿지 말라" 는 신호이지 리포트를 세울 이유가 아니다.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # main 을 명시한다. report.yml 과 같은 이유 - 스캔이 그날 아카이브를
      # 방금 푸시했는데 기본값은 워크플로를 띄운 시점의 커밋이라 그 푸시
      # 이전을 체크아웃한다. 오늘 들어온 행을 검사하지 못한다.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 네트워크를 쓰지 않는다. 아카이브 CSV 만 읽으므로 yfinance rate limit
      # 이나 API 키와 무관하게 결정적으로 돈다 - 이 검사가 빨간불이면
      # 데이터가 실제로 갈린 것이지 외부 사정이 아니다.
      - name: Verify the archives
        run: python verify_archive.py

  # 검사가 실패하면 그날 결과가 조용히 갈린 것이다. 스캔·리포트 실패와 달리
  # 재실행으로 복구되지 않는다 - 아카이브 자체를 고쳐야 한다.
  #
  # 이슈는 기록이고 메일이 도착 보장이다. report.yml 의 notify-failure 와
  # 같은 판단이다 - 저장소 Watch 인원이 0이면 봇이 연 이슈는 아무에게도 닿지 않는다.
  notify-failure:
    needs: verify
    if: always() && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # mailer.py 는 표준 라이브러리만 쓴다. pip install 을 하지 않는 것은
      # 의도다 - 의존성 설치가 죽어서 실패한 경우에도 알림은 나가야 한다.

      - name: Write the alert body
        id: body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # KST 는 서머타임이 없어 UTC+9 고정
          KST_DATE=$(date -u -d '+9 hours' +'%Y-%m-%d')
          echo "kst_date=$KST_DATE" >> "$GITHUB_OUTPUT"
          cat > alert_body.txt <<EOB
          ${KST_DATE} (KST) 아카이브 정합성 검사가 실패했습니다.

          **재실행으로 복구되지 않습니다.** 아카이브 자체를 고쳐야 합니다.
          어느 행인지는 실행 로그에 종목·날짜로 찍혀 있습니다.

          실행 로그: ${RUN_URL}

          ## 무슨 일인가

          총점(\`total\`)이 비어 있는 BUY 행이 아카이브에 들어왔습니다.
          \`backtest.filter_rows\` 는 이런 행을 HOLD 로 **강등**합니다 -
          점수를 모르는 행을 통과시키면 진입 문턱이 있으나 마나가 되기
          때문입니다. 강등 자체는 옳은 처리지만 **조용합니다.** 그날의
          BUY 전환이 흔적 없이 사라지고, 백테스트와 성과 리포트가 그만큼
          갈린 채로 나갑니다.

          이 검사가 통과하는 동안에는 \`min_total\` 문턱이 아무것도 거르지
          않았습니다 (주식 트랙의 70 은 \`calc_signal\` 의 BUY 문턱과 같은
          값이라 구조적으로 무해한 것이 아니라 데이터가 그랬을 뿐입니다).
          오늘부터는 갈립니다.

          ## 확인할 것

          - **오늘 들어온 행인가** — \`history/\` \`history_etf/\` 의 오늘
            자 CSV 를 먼저 보세요. 스캐너가 점수를 못 매긴 채 행을 쓴
            것이라면 \`stock_finder\` 쪽 고장입니다.
          - **과거 행이 갑자기 나타났는가** — 아카이브를 되짚는 도구
            (\`recompute_history.py\`)를 \`--apply\` 로 돌렸을 때 생길 수
            있습니다. 그 경우 되돌릴 백업이 \`history_pre_*\` 에 있는지
            확인하세요.
          - **리포트는 이미 나갔습니다.** 같은 날 성과 리포트 메일의 숫자는
            이 행들이 빠진 값입니다. 고친 뒤 리포트 워크플로를 수동
            재실행하면 다시 계산됩니다.
          EOB

      - name: Open an issue for the broken archive
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KST_DATE: ${{ steps.body.outputs.kst_date }}
        run: |
          TITLE="아카이브 정합성 실패 ${KST_DATE} (KST)"

          # 같은 날 재실행으로 이슈가 중복되지 않게 한다. 메일도 같이 건너뛴다.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "이미 열린 이슈가 있다. 건너뛴다."
            echo "notify=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "notify=yes" >> "$GITHUB_OUTPUT"
          gh issue create --repo "$REPO" --title "$TITLE" \
            --assignee siantyped-ux --body-file alert_body.txt

      # 중복이라고 명시적으로 판정됐을 때만 메일을 건너뛴다. == 'yes' 로 쓰면
      # 안 된다 - 상태 함수가 없는 if 에는 success() 가 암묵적으로 붙어서,
      # gh 가 실패하면 이슈도 못 열고 메일도 조용히 스킵된다.
      - name: Send the alert mail
        if: always() && steps.issue.outputs.notify != 'no'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python mailer.py \
            --subject "[아카이브이상] ${{ steps.body.outputs.kst_date }} (KST)" \
            --body-file alert_body.txt
