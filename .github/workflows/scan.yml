name: AI Stock Finder Auto Scan

on:
  schedule:
    # UTC 02:30 = KST 11:30 (미국 장 마감 후, 한국 장 마감 후)
    - cron: '30 2 * * *'
    # 필요 시 추가 스케줄 예시:
    # - cron: '0 22 * * 1-5'  # UTC 22:00 = KST 07:00 (미국 장 개장 전)
  workflow_dispatch:
    inputs:
      min_us_cap:
        description: '미국 최소 시가총액 (USD, 기본 1e10 = $10B)'
        default: '1e10'
        required: false
      min_kr_cap:
        description: '한국 최소 시가총액 (KRW, 기본 3e11)'
        default: '3e11'
        required: false
      market:
        description: '스캔 시장 (US / KR / ALL)'
        default: 'ALL'
        required: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'stock_finder_dashboard.html'
      - 'dashboard_data.js'

permissions:
  contents: write

jobs:
  scan:
    # push 이벤트에서는 스캔을 건너뛰고 배포만 수행 (schedule/workflow_dispatch에서만 스캔)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock finder scan
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python stock_finder.py \
            --market ${{ github.event.inputs.market || 'ALL' }} \
            --min-us-cap ${{ github.event.inputs.min_us_cap || '1e10' }} \
            --min-kr-cap ${{ github.event.inputs.min_kr_cap || '3e11' }} \
            --sleep 0.2

      - name: Commit and push dashboard_data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload scan log as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-log-${{ github.run_number }}
          path: |
            scan_log.txt
            dashboard_data.js
          retention-days: 7

  deploy-pages:
    needs: scan
    # scan이 성공했거나(schedule/dispatch), skip되었을 때(push) 모두 배포
    if: always() && (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest (with new dashboard data)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
