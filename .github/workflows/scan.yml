name: AI Stock Finder Auto Scan

on:
  schedule:
    # UTC 22:xx = KST 익일 07:xx (미국 장 마감 후, 한국 장 개장 전)
    # 21시대는 쓰지 않는다. 표준시(EST) 기간에 미국 마감 16:00 EST 가 정확히
    # 21:00 UTC 라 버퍼가 0이 된다. 22시대면 서머타임·표준시 모두 여유가 있다.
    #
    # 정각(:00)을 피해 :37 에 건다. 정각은 Actions 스케줄러가 가장 붐비는
    # 슬롯이라 지연이 길고, 길다 못해 이벤트가 버려진다. 2026-08-26 에
    # '0 22 * * *' 이 실제로 유실됐다 - 실행이 생성조차 되지 않았다. 그 직전
    # 나흘의 시작 시각도 22:25 → 22:26 → 22:29 → 22:31 로 계속 밀리고 있었다.
    - cron: '37 22 * * *'
    # 따라잡기. 본 실행이 유실되면 이 실행이 같은 스캔을 돌린다. 스코어는
    # 시점 데이터라 그날 놓치면 영구히 복구할 수 없으므로, 크론 하나에
    # 하루치를 걸지 않는다. 이미 그날 아카이브가 있으면 guard 잡이 막는다.
    # 01:17 UTC = 10:17 KST, 본 실행이 최대로 밀려도 끝나 있을 시각이다.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      min_us_cap:
        description: '미국 주식 최소 시가총액 (USD, 기본 1e10 = $10B)'
        default: '1e10'
        required: false
      min_etf_aum:
        description: '미국 ETF 최소 AUM (USD, 기본 1e9 = $1B)'
        default: '1e9'
        required: false
      min_total:
        description: '출력 최소 종합점수 (기본 70 · 주식과 ETF 공통)'
        default: '70'
        required: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'stock_finder_dashboard.html'
      - 'dashboard_data.js'
      - 'dashboard_data_etf.js'

permissions:
  contents: write

# 크론이 둘이 되었으니 겹치는 경우를 막아야 한다. 본 실행이 크게 밀려 따라잡기
# 시각까지 물리면 같은 날을 두 번 스캔하고, 커밋 두 개가 서로 rebase 로 부딪친다.
# cancel-in-progress 는 false 다 - 돌고 있는 스캔을 죽이면 그날 데이터를 잃는다.
# 뒤에 온 실행은 기다렸다가 guard 에서 아카이브를 보고 스스로 빠진다.
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 그날 스캔이 이미 돌았는지 본다. 따라잡기 크론이 멀쩡히 끝난 하루를 다시
  # 돌지 않게 하는 것이 이 잡의 전부다. 판단 근거는 scan_due.py 머리말에 있다.
  guard:
    # push 이벤트에서는 스캔을 건너뛰고 배포만 수행한다. 여기서 걸러 두면
    # scan 은 needs 로 따라 skip 된다.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      kst_date: ${{ steps.check.outputs.kst_date }}

    steps:
      # main 을 명시한다. 따라잡기 실행이 봐야 하는 것은 본 실행이 방금 밀어
      # 넣었을 수도 있는 아카이브라, 기본값(이벤트 시점 커밋)으로는 놓친다.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # pip install 을 하지 않는다. scan_due.py 는 표준 라이브러리만 쓴다 -
      # 의존성 설치가 깨진 날에도 이 판단은 서야 한다.
      - name: Decide whether today's scan still has to run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scan_due.py --archive history --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"

      # 따라잡기가 실제로 일을 했다면 본 실행이 유실된 것이다. 복구는 되지만
      # 조용히 넘어가면 22:37 슬롯이 계속 버려지는 것을 모른 채 지나간다.
      - name: Say that the primary schedule was missed
        if: github.event.schedule == '17 1 * * *' && steps.check.outputs.needed == 'true'
        run: |
          echo "::warning::22:37 UTC 본 실행이 유실됐습니다. 따라잡기가 ${{ steps.check.outputs.kst_date }} (KST) 스캔을 대신 돌립니다."

  scan:
    needs: guard
    if: needs.guard.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # rebase가 필요하므로 shallow clone 대신 전체 히스토리를 가져옴
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock finder scan
        # workflow_dispatch 입력은 env 로 받아 셸 변수로 넘긴다. run 본문에
        # ${{ }} 를 직접 넣으면 셸이 돌기 전에 워크플로 텍스트로 치환되어,
        # 입력에 따옴표와 세미콜론을 섞으면 임의 명령이 실행된다. 이 스텝은
        # FMP·FRED·Anthropic 키를 전부 들고 있다.
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIN_US_CAP: ${{ github.event.inputs.min_us_cap || '1e10' }}
          MIN_ETF_AUM: ${{ github.event.inputs.min_etf_aum || '1e9' }}
          MIN_TOTAL: ${{ github.event.inputs.min_total || '70' }}
        run: |
          python stock_finder.py \
            --track stocks \
            --min-us-cap "$MIN_US_CAP" \
            --min-total "$MIN_TOTAL" \
            --sleep 0.2 \
            --workers 4

      # ETF 는 주식과 점수 척도가 달라(총점 표준편차 15.1 대 10.3) 한 목록에
      # 두면 상위를 쓸어간다. 유니버스부터 갈라 각자의 순위를 낸다.
      #
      # continue-on-error 인 것은 순서 때문이다. ETF 가 여기서 죽어도 앞서
      # 끝난 주식 트랙 결과는 커밋해야 한다 - 시점 데이터라 그날 스코어를
      # 놓치면 영구히 복구할 수 없다. 실패 자체는 커밋이 끝난 뒤 마지막
      # 스텝에서 워크플로 결과로 올린다.
      - name: Run the ETF track scan
        id: etf_scan
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIN_ETF_AUM: ${{ github.event.inputs.min_etf_aum || '1e9' }}
          MIN_TOTAL: ${{ github.event.inputs.min_total || '70' }}
        run: |
          python stock_finder.py \
            --track etf \
            --min-etf-aum "$MIN_ETF_AUM" \
            --min-total "$MIN_TOTAL" \
            --sleep 0.2 \
            --workers 4

      - name: Commit and push dashboard_data.js
        env:
          ETF_OUTCOME: ${{ steps.etf_scan.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ETF 트랙이 죽었으면 그 트랙의 대시보드는 커밋하지 않는다.
          # _save_intermediate 가 중간 결과를 실제 dashboard_data_etf.js 에
          # 쓰기 때문에, 완결성 가드에 걸려 죽은 뒤에도 잘린 파일이 남는다.
          # 그대로 커밋하면 아카이브에는 그날 ETF 행이 없는데 대시보드만
          # 부분 데이터로 배포된다 - 어제 것을 그대로 두는 편이 낫다.
          if [ "$ETF_OUTCOME" = "failure" ]; then
            echo "::warning::ETF 트랙 실패 - dashboard_data_etf.js 는 커밋하지 않습니다."
            git checkout -- dashboard_data_etf.js || true
          fi

          git add dashboard_data.js dashboard_data_etf.js history/ history_etf/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # KST 는 서머타임이 없어 UTC+9 고정. TZ=Asia/Seoul 은 tzdata 가 없는
            # 환경에서 조용히 UTC 를 KST 라고 찍으므로 오프셋으로 계산한다.
            git commit -m "Auto scan: $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M KST')"
            # 스캔 중 main이 앞으로 갔을 수 있으므로 rebase 후 푸시 (충돌 시 최대 3회 재시도)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "push retry $i"
              sleep 5
            done
            echo "::error::Failed to push scan results after 3 attempts"
            exit 1
          fi

      - name: Upload scan log as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-log-${{ github.run_number }}
          path: |
            scan_log.txt
            dashboard_data.js
            dashboard_data_etf.js
          retention-days: 7

      # 커밋이 끝난 뒤에 올린다. 여기서 실패시켜야 ETF 가 죽은 것을 알림이
      # 잡으면서도 주식 트랙 결과는 이미 저장돼 있다.
      - name: Fail if the ETF track scan failed
        if: steps.etf_scan.outcome == 'failure'
        run: |
          echo "::error::ETF 트랙 스캔 실패. 주식 트랙 결과는 커밋됐습니다."
          exit 1

  deploy-pages:
    needs: scan
    # scan 이 성공했거나(schedule/dispatch), push 로 skip 되었을 때 배포한다.
    # skip 을 push 로 한정하는 것은 따라잡기 때문이다 - 그날 스캔이 이미 끝나
    # guard 가 막은 실행은 배포할 새 데이터가 없다. 조건을 열어 두면 매일
    # 같은 내용을 한 번씩 더 배포하게 된다.
    if: always() && (needs.scan.result == 'success' || (needs.scan.result == 'skipped' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest (with new dashboard data)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 스캔이 끝나면 바로 성과 리포트를 만들어 메일로 보낸다. report.yml 이
  # 자체 cron 을 갖지 않는 이유는 그 파일 머리말에 있다.
  #
  # deploy-pages 가 아니라 scan 에만 매단다. Pages 배포가 실패해도 리포트는
  # 나가야 한다 - 서로 상관이 없다.
  #
  # if 를 쓰지 않는다. needs 가 성공해야만 도는 것이 기본이라, 스캔이 실패하면
  # 리포트도 자동으로 건너뛴다. push 이벤트에서 스캔이 skip 될 때도 같이
  # 건너뛴다 - 대시보드 파일만 밀어 넣었을 때 리포트 메일이 갈 이유가 없다.
  #
  # 호출된 워크플로는 여기서 준 권한을 넘지 못한다. notify-failure 가 이슈를
  # 열어야 하므로 issues: write 를 같이 넘긴다.
  report:
    needs: scan
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report.yml
    secrets: inherit

  # 스캔이 실패하면 그날 스코어는 영구히 사라진다. 시점 데이터라 나중에
  # 재계산할 수 없고, 소급 적재도 dashboard_data.js 스냅샷이 있어야 하는데
  # 스캔이 안 돌면 그 스냅샷 자체가 없다. 조용히 넘어가지 않도록 이슈를 연다.
  notify-failure:
    needs: scan
    if: always() && needs.scan.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # mailer.py 는 표준 라이브러리만 쓴다. pip install 을 하지 않는 것은
      # 의도다 - 스캔이 의존성 설치에서 죽어도 알림은 나가야 한다.

      - name: Write the alert body
        id: body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # KST 는 서머타임이 없어 UTC+9 고정
          KST_DATE=$(date -u -d '+9 hours' +'%Y-%m-%d')
          echo "kst_date=$KST_DATE" >> "$GITHUB_OUTPUT"
          cat > alert_body.txt <<EOB
          ${KST_DATE} (KST) 자동 스캔이 실패했습니다.

          **이 날짜의 스코어는 복원할 수 없습니다.** 스코어는 시점 데이터라
          나중에 다시 계산할 수 없고, 소급 적재는 \`dashboard_data.js\` 커밋
          스냅샷에서 복원하는 방식인데 스캔이 실패하면 그 스냅샷도 없습니다.

          실행 로그: ${RUN_URL}

          ## 확인할 것

          - **수집률 미달** — 로그에 \`수집률 ... 기준\` 이 있으면 완결성 가드가
            부분 데이터를 막은 것입니다. yfinance rate limit(429)이 흔한 원인이며,
            \`--workers\` 를 낮추면 완화됩니다.
          - **API 키 만료** — FMP / FRED 중 하나가 죽으면 스캔이 멈춥니다.
          - **timeout** — 120분 상한에 걸렸는지 확인하세요.
          - **push 실패** — rebase 재시도 3회를 모두 소진했는지 확인하세요.

          복구되면 이 이슈를 닫아 주세요. 하루치 공백은 남지만, 며칠씩 조용히
          비는 것을 막는 것이 이 알림의 목적입니다.
          EOB

      - name: Open an issue for the lost day
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KST_DATE: ${{ steps.body.outputs.kst_date }}
        run: |
          TITLE="스캔 실패 ${KST_DATE} (KST) - 그날 스코어 유실"

          # 같은 날 재실행으로 이슈가 중복되지 않게 한다. 메일도 같이 건너뛴다 -
          # 재실행마다 같은 메일이 쌓일 이유가 없다.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "이미 열린 이슈가 있다. 건너뛴다."
            echo "notify=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "notify=yes" >> "$GITHUB_OUTPUT"
          gh issue create --repo "$REPO" --title "$TITLE" \
            --assignee siantyped-ux --body-file alert_body.txt

      # 중복이라고 명시적으로 판정됐을 때만 메일을 건너뛴다. == 'yes' 로 쓰면
      # 안 된다 - 상태 함수가 없는 if 에는 success() 가 암묵적으로 붙어서,
      # gh 가 실패하면 이슈도 못 열고 메일도 조용히 스킵된다. GitHub 알림을
      # 믿을 수 없을 때 도달을 보장하는 것이 이 메일의 존재 이유다.
      - name: Send the alert mail
        if: always() && steps.issue.outputs.notify != 'no'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python mailer.py \
            --subject "[스캔실패] ${{ steps.body.outputs.kst_date }} (KST) - 그날 스코어 유실" \
            --body-file alert_body.txt
