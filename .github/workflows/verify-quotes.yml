name: Verify FMP Quotes

# 이 워크플로가 답하려는 질문은 하나다.
#   "aftermarket" 이라는 이름의 FMP 호가 엔드포인트가 정규장에도 갱신되는가?
#
# 장외에 돌리면 답이 나오지 않는다. 호가창이 비어 스프레드가 구조적으로
# 벌어지기 때문이다 (2026-08-24 휴장 중 실측: 주식 중앙 1.515% · ETF 4.172%).
# 그래서 미국 정규장 안에서 도는 것이 이 파일의 전부다.
#
# 로컬에서 돌리려면 개발자 PC 가 KST 22:30~05:00 사이에 켜져 있어야 한다.
# GitHub 러너는 그럴 필요가 없다.

on:
  schedule:
    # 15:00 UTC = 11:00 ET = 정규장(09:30~16:00 ET) 한복판.
    # 한복판을 고른 것은 GitHub Actions 스케줄이 부하에 따라 5~30분 지연되기
    # 때문이다. 개장 직후를 노리면 지연이 장 밖으로 밀어낼 수 있지만,
    # 11:00 ET 는 마감까지 5시간 여유가 있다.
    # 서머타임(EDT) 기준이다. 표준시(EST) 기간에는 12:00 ET 가 되는데 그래도
    # 정규장 안이다.
    # 주말은 뺀다 - 휴장이면 스크립트가 판정을 보류할 뿐이라 낭비다.
    #
    # 정각을 피해 :26 에 건다. 정각은 Actions 스케줄러가 가장 붐벼서 크게
    # 밀린다 - 이 워크플로도 실제로 41분, 77분씩 밀려 시작했다. 늦게 돌면
    # 확인 시각이 마감 쪽으로 끌려간다.
    - cron: '26 15 * * 1-5'
  workflow_dispatch:
    inputs:
      sample:
        description: '자산군별 표본 종목 수 (0=유니버스 전체)'
        default: '200'
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify quote endpoint
        # 입력을 env 로 받아 셸 변수로 쓴다. run 본문에 ${{ }} 를 직접 넣으면
        # 셸이 돌기 전에 워크플로 텍스트로 치환되므로, 입력에 따옴표와 세미콜론을
        # 섞어 임의 명령을 실행시킬 수 있다. 이 러너는 FMP 키를 들고 있다.
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SAMPLE: ${{ github.event.inputs.sample || '200' }}
        # shell 을 명시해야 pipefail 이 붙는다. 기본 셸은 `bash -e {0}` 라
        # 파이프라인의 종료 코드가 마지막 명령인 tee 의 것이 된다 - 판정이
        # [실패] 로 나와도 스텝은 초록으로 끝났고, 그래서 이 워크플로는
        # 지금까지 한 번도 실패할 수 없었다.
        shell: bash
        run: |
          python verify_quotes.py --sample "$SAMPLE" 2>&1 | tee verify_quotes_output.txt

      - name: Publish result to job summary
        # 실패해도 결과를 남긴다. 판정이 [실패] 로 나오는 것 자체가 알아야 할
        # 정보이며, 그 경우 Polygon.io 나 IBKR 로 가야 한다는 뜻이다.
        if: always()
        run: |
          {
            echo '## FMP 호가 엔드포인트 검증'
            echo
            echo '```'
            cat verify_quotes_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-quotes-output
          path: verify_quotes_output.txt
          retention-days: 14

  # 판정이 job summary 에만 남아 있었다. 스캔·리포트는 실패하면 이슈를 열고
  # 메일을 보내는데 이 워크플로만 아무 데도 알리지 않았다 - 하필 여기서
  # 새는 것이 가장 위험하다. 호가가 틀어져도 스캔은 계속 '성공'하면서
  # 잘못된 가격을 아카이브에 쌓고, 시점 데이터라 나중에 되돌릴 수 없다.
  notify-failure:
    needs: verify
    if: always() && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # mailer.py 는 표준 라이브러리만 쓴다. pip install 을 하지 않는 것은
      # 의도다 - 검증이 의존성 설치에서 죽어도 알림은 나가야 한다.

      - name: Write the alert body
        id: body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # KST 는 서머타임이 없어 UTC+9 고정
          KST_DATE=$(date -u -d '+9 hours' +'%Y-%m-%d')
          echo "kst_date=$KST_DATE" >> "$GITHUB_OUTPUT"
          cat > alert_body.txt <<EOB
          ${KST_DATE} (KST) FMP 호가 엔드포인트 검증이 실패했습니다.

          **스캔은 계속 성공합니다.** 호가는 스코어링에 쓰지 않으므로 이 실패가
          스캔을 멈추지 않습니다. 그래서 더 위험합니다 - 실행 레이어가 잘못된
          가격 위에서 돌게 됩니다.

          실행 로그: ${RUN_URL}

          ## 확인할 것

          - **정규장이 아니었나** — [보류] 는 실패로 올리지 않습니다. 이 알림이
            왔다면 정규장 중 판정이거나 스크립트 자체가 죽은 것입니다.
          - **호가가 갱신되지 않음** — \`batch-aftermarket-quote\` 가 정규장에도
            시간외 값을 주면 FMP 로는 실행 레이어를 만들 수 없습니다.
            Polygon.io 또는 IBKR 로 가야 합니다.
          - **FMP 키 만료** — 키가 없으면 커버리지가 0으로 나옵니다.

          판정 전문은 실행 로그의 job summary 에 있습니다.
          EOB

      - name: Open an issue for the failed verification
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KST_DATE: ${{ steps.body.outputs.kst_date }}
        run: |
          TITLE="호가 검증 실패 ${KST_DATE} (KST)"

          # 같은 날 재실행으로 이슈가 중복되지 않게 한다. 메일도 같이 건너뛴다.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "이미 열린 이슈가 있다. 건너뛴다."
            echo "notify=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "notify=yes" >> "$GITHUB_OUTPUT"
          gh issue create --repo "$REPO" --title "$TITLE" \
            --assignee siantyped-ux --body-file alert_body.txt

      # 중복이라고 명시적으로 판정됐을 때만 건너뛴다. == 'yes' 로 쓰면 안 된다 -
      # 상태 함수가 없는 if 에는 success() 가 암묵적으로 붙어서, gh 가 실패하면
      # 이슈도 못 열고 메일도 조용히 스킵된다 (scan.yml 과 같은 이유).
      - name: Send the alert mail
        if: always() && steps.issue.outputs.notify != 'no'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python mailer.py \
            --subject "[호가검증실패] ${{ steps.body.outputs.kst_date }} (KST)" \
            --body-file alert_body.txt
